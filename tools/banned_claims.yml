# Banned claims policy — language guardrails for the Urban Municipal
# Intelligence Platform. Every entry is a regex, case-insensitive.
# Add `whole_word: true` if the term should not match inside another word.
# `suggested` is shown to authors when the linter fires.

banned:
  - phrase: "live satellite"
    suggested: "satellite snapshot"
    why: "Implies a real-time feed we do not have."

  - phrase: "real[- ]time satellite"
    suggested: "satellite snapshot"
    why: "Implies a real-time feed we do not have."

  - phrase: "in real time"
    suggested: "as of <capture date>"
    why: "We do not operate on real-time data."

  - phrase: "ai[- ]confirmed violation"
    suggested: "suspected indicator pending review"
    why: "Models do not adjudicate violations."

  - phrase: "ai[- ]confirmed"
    suggested: "model-flagged"
    why: "Reserve 'confirmed' for human-validated outcomes."

  - phrase: "verified violation"
    suggested: "suspected violation pending review"
    why: "No automated verification of violations."

  - phrase: "violation confirmed"
    suggested: "suspected indicator pending review"
    why: "No automated confirmation."

  - phrase: "official evidence"
    suggested: "preliminary observation"
    why: "Evidence is officer-validated, not system-generated."

  - phrase: "automatic penalty"
    suggested: "review recommended"
    why: "We never trigger penalties automatically."

  - phrase: "automated fine"
    suggested: "review recommended"
    why: "We never trigger fines automatically."

  - phrase: "automatic enforcement"
    suggested: "review recommended"
    why: "We never enforce automatically."

  - phrase: "guaranteed"
    suggested: "consistent with"
    why: "Avoid overclaim language."

  - phrase: "100% confidence"
    suggested: "high credibility (see breakdown)"
    why: "Avoid overclaim language."

  - phrase: "we caught"
    suggested: "the system flagged"
    why: "Avoid adversarial framing."

  - phrase: "caught violator"
    suggested: "flagged parcel"
    why: "Avoid adversarial framing."

  # ---------------------------------------------------------------------
  # DAL forbidden affordances (Phase 31C-S0). Per badge brief §4.2 / §5.4
  # and CLAUDE.md §11. Word-bounded so identifier names like
  # `urgent_case_ids` or `enforcement_score` do not falsely trip — the
  # policy targets user-facing copy, not Python field names.
  #
  # Phase 32.5.1 R-CI fix: also exclude negation contexts so the
  # constitutional negated boundaries the product is REQUIRED to display
  # ("No enforcement", "Not enforcement", "anti-enforcement") do not
  # falsely trip. The standalone positive claim ("enforcement", "We will
  # enforce X") is unchanged. Each negative lookbehind is fixed-width
  # (Python `re` requirement). Lookbehinds chain as AND.
  # ---------------------------------------------------------------------

  - phrase: "(?<![a-zA-Z_.])(?<!No\s)(?<!no\s)(?<!Not\s)(?<!not\s)(?<!anti-)enforcement(?![a-zA-Z_.])"
    suggested: "recommended next step"
    why: "DAL is advisory-only; no enforcement authority. (Negated boundaries 'No/Not/anti- enforcement' are explicitly allowed.)"

  - phrase: "(?<![a-zA-Z_.])(?<!No\s)(?<!no\s)(?<!Not\s)(?<!not\s)(?<!anti-)enforce(?![a-zA-Z_.])"
    suggested: "review"
    why: "DAL never enforces. (Negated boundaries 'No/Not/anti- enforce' are explicitly allowed.)"

  - phrase: "automatic\s+escalation"
    suggested: "reviewer-initiated escalation"
    why: "Escalation is reviewer-driven, never automatic."

  - phrase: "auto[- ]escalate"
    suggested: "reviewer-initiated escalation"
    why: "Escalation is reviewer-driven, never automatic."

  - phrase: "confirmed\s+violation"
    suggested: "observed pattern under review"
    why: "Models and projections never confirm violations."

  - phrase: "(?<![a-zA-Z_.])urgent(?![a-zA-Z_.])"
    suggested: "warrants accelerated review"
    why: "Avoids urgency-as-obligation framing per badge brief §0."

  - phrase: "(?<![a-zA-Z_.])emergency(?![a-zA-Z_.])"
    suggested: "warrants immediate reviewer attention"
    why: "No emergency framing on advisory surfaces."

  - phrase: "(?<![a-zA-Z_.])alarm(?![a-zA-Z_.])"
    suggested: "activation signal"
    why: "DAL surfaces are not alarms."

  - phrase: "red[- ]flag"
    suggested: "activation signal"
    why: "Removes alarm/severity coupling."

  - phrase: "(?<![a-zA-Z_.])alert(?![a-zA-Z_.])"
    suggested: "signal"
    why: "Reserve neutral 'signal' over alarm-coded 'alert'."

  - phrase: "must[- ]act"
    suggested: "reviewer may consider"
    why: "DAL never directs imperative action."

  - phrase: "you\s+must"
    suggested: "consider"
    why: "DAL never directs imperative action."

  - phrase: "do\s+not\s+delay"
    suggested: "review when convenient within window"
    why: "No countdown-style pressure."

  - phrase: "final\s+notice"
    suggested: "review window closing"
    why: "No legal-notice framing."

