  # ---------------------------------------------------------------------
  # OID forbidden monetization / ROI / progress-to-target framing
  # (Phase OID-P1; design §4 #2-#3 + §8). The DecisionBasisBlock
  # describes basis, not ambition — no ROI, no currency, no "% to goal",
  # no improvement/regression coloring, no savings claims. Word-bounded
  # so identifier names like `kwd_total_field` still pass.
  # ---------------------------------------------------------------------

  - phrase: "(?<![a-zA-Z_.])ROI(?![a-zA-Z_.])"
    suggested: "outcome basis"
    why: "DecisionBasisBlock describes basis, not return on investment."

  - phrase: "return\s+on\s+investment"
    suggested: "outcome basis"
    why: "DecisionBasisBlock describes basis, not return on investment."

  # Currency codes require numeric adjacency to avoid collision with legit
  # technical acronyms (e.g. SAR = Synthetic Aperture Radar in remote
  # sensing). Match shapes like "1200 KWD", "KWD 1,200", "$3.5K SAR".
  - phrase: "(?:[0-9][0-9,.]*\s*KWD|KWD\s*[0-9])"
    suggested: "(no currency framing)"
    why: "No monetary amounts in advisory surfaces."

  - phrase: "(?:[0-9][0-9,.]*\s*SAR|SAR\s*[0-9])"
    suggested: "(no currency framing)"
    why: "No monetary amounts in advisory surfaces."

  - phrase: "(?:[0-9][0-9,.]*\s*AED|AED\s*[0-9])"
    suggested: "(no currency framing)"
    why: "No monetary amounts in advisory surfaces."

  - phrase: "saved\s+hours"
    suggested: "(no productivity framing)"
    why: "No savings/productivity claims on advisory surfaces."

  - phrase: "saved\s+cost"
    suggested: "(no cost framing)"
    why: "No savings/cost claims on advisory surfaces."

  - phrase: "cost\s+saved"
    suggested: "(no cost framing)"
    why: "No savings/cost claims on advisory surfaces."

  - phrase: "monetization"
    suggested: "(no monetization framing)"
    why: "No monetization framing on advisory surfaces."

  - phrase: "progress\s+to\s+(?:goal|target)"
    suggested: "(no ambition framing)"
    why: "DecisionBasisBlock describes basis, not progress to goal."

  - phrase: "%\s+to\s+(?:goal|target)"
    suggested: "(no ambition framing)"
    why: "DecisionBasisBlock describes basis, not progress to goal."

  # AR equivalents (authored, not machine-translated).
  - phrase: "العائد\s+على\s+الاستثمار"
    suggested: "أساس النتيجة"
    why: "AR equivalent of 'return on investment'."

  - phrase: "(?<![ا-ي])توفير(?![ا-ي])"
    suggested: "(no savings framing)"
    why: "AR equivalent of 'savings'."

  # ---------------------------------------------------------------------
  # P5 Municipal Outcome Layer — financial / enforcement framing
  # (Phase P5.0). The Municipal Financial Outcome Layer projects bounded
  # exposure bands and operational value drivers downstream of Decision
  # Basis. It never produces currency, ROI, savings claims, profit
  # guarantees, automatic penalties, or enforcement framing. Every
  # projection carries caveats and links back to Decision Basis.
  # See docs/architecture/p5_municipal_outcome_execution_memo.md.
  # Patterns are word-bounded where identifier-name collision is plausible
  # (e.g. `fine_grained`, `define`, `penalty_score_field`). Whitespace
  # tokens use \s+ so paraphrase via NBSP / extra space cannot bypass.
  # AR entries authored, not machine-translated.
  # ---------------------------------------------------------------------

  # --- EN: guarantee / ROI / savings / loss-reduction framing ----------

  - phrase: "guaranteed\s+ROI"
    suggested: "outcome basis (bounded, non-guaranteed)"
    why: "P5 never guarantees return; outputs are exposure bands, not yields."

  - phrase: "guaranteed\s+loss\s+reduction"
    suggested: "projected exposure-band shift (caveated)"
    why: "P5 never guarantees reduction; projections are conditional on Decision Basis."

  - phrase: "profit\s+guarantee"
    suggested: "(no profit framing on advisory surfaces)"
    why: "P5 is a municipal projection layer, not a financial product."

  - phrase: "savings\s+guarantee"
    suggested: "(no savings framing on advisory surfaces)"
    why: "P5 never asserts savings; bounded operational counts only."

  - phrase: "confirmed\s+savings"
    suggested: "(no savings framing on advisory surfaces)"
    why: "Savings cannot be confirmed in MVP; calibration gate (P6) required."

  - phrase: "exact\s+currency\s+impact"
    suggested: "exposure band (Low / Medium / High / Critical / Insufficient Basis)"
    why: "P5 MVP forbids precise currency in projections."

  # --- EN: enforcement / penalty / fine framing ------------------------

  - phrase: "automatic\s+fine"
    suggested: "review recommended"
    why: "P5 never triggers fines automatically; HITL gate is mandatory."

  - phrase: "enforcement\s+action"
    suggested: "recommended next step (HITL-gated)"
    why: "P5 surfaces signals, never enforcement actions."

  - phrase: "enforcement\s+required"
    suggested: "review recommended"
    why: "P5 never asserts enforcement requirements; municipal review is sole authority."

  - phrase: "(?<![a-zA-Z_.])penalty\s+recommended(?![a-zA-Z_.])"
    suggested: "review recommended"
    why: "P5 never recommends penalties; outputs are exposure indicators."

  - phrase: "(?<![a-zA-Z_.])fine\s+issued(?![a-zA-Z_.])"
    suggested: "(no fine framing — review recommended)"
    why: "P5 never issues fines or describes them as system output."

  # --- EN: confirmation framing ----------------------------------------

  - phrase: "confirmed\s+breach"
    suggested: "observed pattern under review"
    why: "P5 never confirms breach; basis-conditional exposure indicators only."

  - phrase: "non[- ]?compliant\s+confirmed"
    suggested: "exposure indicated; review recommended"
    why: "Compliance status is a municipal-review outcome, not a P5 projection."

  # --- EN: currency-shape coverage extension (USD / EUR / GBP) ---------
  # Mirrors the existing KWD/SAR/AED rules; numeric adjacency required so
  # legitimate technical acronyms / non-currency uses are not tripped.

  - phrase: "(?:[0-9][0-9,.]*\s*USD|USD\s*[0-9])"
    suggested: "(no currency framing — exposure band only)"
    why: "No monetary amounts in advisory surfaces."

  - phrase: "(?:[0-9][0-9,.]*\s*EUR|EUR\s*[0-9])"
    suggested: "(no currency framing — exposure band only)"
    why: "No monetary amounts in advisory surfaces."

  - phrase: "(?:[0-9][0-9,.]*\s*GBP|GBP\s*[0-9])"
    suggested: "(no currency framing — exposure band only)"
    why: "No monetary amounts in advisory surfaces."

